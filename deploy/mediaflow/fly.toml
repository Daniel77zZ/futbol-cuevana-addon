# Fly.io deployment for MediaFlow Proxy.
#
# MediaFlow is the extraction and playback engine the addon depends on for
# Cuevana. The Worker runs on Cloudflare's edge, so MediaFlow has to be reachable
# over the public internet; localhost and the LAN are not options.
#
# The published upstream image is used instead of building from source: this
# repository's dev environment has no Docker, and upstream ships multi-arch
# images. The tag is pinned on purpose -- `latest` is not a version.
#
# See README.md in this directory for the full procedure.

# Must be globally unique across Fly.io. Rename if the create call rejects it.
app = "futbol-mediaflow"
primary_region = "iad"

[build]
  image = "mhdzumair/mediaflow-proxy:v2.4.9"

[env]
  PORT = "8888"

  # Upstream's own docker-compose.yml sets this, and the upstream uvicorn docs
  # say to pass --forwarded-allow-ips "*" whenever the server is not accessed
  # directly. The image's CMD defaults it to 127.0.0.1, which is wrong here: the
  # connection originates from Fly's proxy, not from 127.0.0.1, so the forwarded
  # headers (X-Forwarded-Proto and friends) would be ignored.
  FORWARDED_ALLOW_IPS = "*"

  # With no Redis attached, each worker keeps a private extractor/segment cache
  # and re-does the same extraction instead of sharing a result. One worker is
  # the coherent choice until a Redis instance exists.
  GUNICORN_WORKERS = "1"

  # Public endpoint: close the admin surfaces the image exposes by default.
  DISABLE_HOME_PAGE = "true"
  DISABLE_DOCS = "true"
  DISABLE_SPEEDTEST = "true"

  # API_PASSWORD is deliberately absent: it is a secret, set with
  # `fly secrets set`. Never put it in this file.

[http_service]
  internal_port = 8888
  force_https = true
  # Suspend when idle to keep the bill down. The tradeoff is a cold start on the
  # first play after a quiet period, plus loss of the in-memory extractor cache.
  # Set auto_stop_machines = false and min_machines_running = 1 for an always-on
  # machine at roughly $6.70/month.
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  # 1GB: ffmpeg plus HLS pre-buffering (ENABLE_HLS_PREBUFFER defaults to true and
  # may use up to 80% of system memory for its segment cache). 256MB is the
  # cheapest machine but is not a sane target for this workload.
  size = "shared-cpu-1x"
  memory = "1gb"
