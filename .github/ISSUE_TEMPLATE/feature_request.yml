name: Feature Request
description: Suggest a new feature or improvement
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please describe what you'd like to see added.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which area does this feature relate to?
      options:
        - "New source/host support (extractor)"
        - "New catalog source"
        - "Worker API / Stremio features"
        - "UI / Manifest improvements"
        - "Performance / Caching"
        - "Deployment / CI/CD"
        - "Documentation"
      multiple: true
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What problem does this solve? What's the use case?
      placeholder: Currently users cannot...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: How would you like this to work?
      placeholder: Add a new extractor for...

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds?
      placeholder: Could also use...

  - type: checkboxes
    id: checklist
    attributes:
      label: Willingness to Contribute
      options:
        - label: I can implement this myself
        - label: I can help test this
        - label: I can update documentation