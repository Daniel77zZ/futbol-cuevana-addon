name: Resolve Stream On-Demand  # force re-parse

permissions:
  contents: read

'on':
  workflow_dispatch:
inputs:
        target:
          description: 'Target type (futbol/cine/series/vidhide)'
          required: true
          type: choice
          options:
            - futbol
            - cine
            - series
            - vidhide
      id:
        description: 'Content ID (e.g., fc-espn, cu-resident-evil)'
        required: true
        type: string
      url:
        description: 'Embed URL to resolve'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no KV write)'
        required: false
        type: boolean
        default: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
      options: --user root
    defaults:
      run:
        working-directory: /__w/futbol-cuevana-addon/futbol-cuevana-addon
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            chromium \
            chromium-driver \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            curl \
            && rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r extractors/requirements.txt

      - name: Install Playwright browsers
        run: python3 -m playwright install chromium

      - name: Validate inputs
        env:
          TARGET: ${{ inputs.target }}
          CONTENT_ID: ${{ inputs.id }}
          EMBED_URL: ${{ inputs.url }}
        run: |
          set -eu
          if ! printf '%s' "$TARGET" | grep -Eq '^(futbol|cine|series|vidhide)$'; then
            echo "::error::Invalid target: $TARGET"; exit 1
          fi
          # The content id becomes part of a Cloudflare KV key, so it must not
          # contain ':' or '/' -- otherwise it could address arbitrary keys.
          if ! printf '%s' "$CONTENT_ID" | grep -Eq '^[A-Za-z0-9._-]{1,64}$'; then
            echo "::error::Invalid id: must match [A-Za-z0-9._-]{1,64}"; exit 1
          fi
          if ! printf '%s' "$EMBED_URL" | grep -Eq '^https?://[^[:space:]]+$'; then
            echo "::error::Invalid url: must be an absolute http(s) URL"; exit 1
          fi

      - name: Resolve stream
        env:
          TARGET: ${{ inputs.target }}
          CONTENT_ID: ${{ inputs.id }}
          EMBED_URL: ${{ inputs.url }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 -m extractors.main --type "$TARGET" --id "$CONTENT_ID" --url "$EMBED_URL" --output /tmp/result.json

      - name: Write stream to Cloudflare KV
        if: ${{ !inputs.dry_run }}
        env:
          TARGET: ${{ inputs.target }}
          CONTENT_ID: ${{ inputs.id }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          set -eu
          case "$TARGET" in
            futbol) STREAM_TYPE="tv" ;;
            cine)   STREAM_TYPE="movie" ;;
            series) STREAM_TYPE="series" ;;
            vidhide) STREAM_TYPE="tv" ;;  # vidhide can be used for both TV and movies, default to tv
            *)      echo "::error::Invalid target: $TARGET"; exit 1 ;;
          esac
          curl -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/stream:${STREAM_TYPE}:${CONTENT_ID}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/result.json
