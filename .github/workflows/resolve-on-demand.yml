name: Resolve On Demand

'on':
  workflow_dispatch:
    inputs:
      target:
        description: 'Target to resolve (e.g., issue number, PR number, or "all")'
        required: true
        type: string
      dry_run:
        description: 'Run in dry-run mode without making changes'
        required: false
        type: boolean
        default: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run resolver
        run: python scripts/resolve.py --target "${{ github.event.inputs.target }}" ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}