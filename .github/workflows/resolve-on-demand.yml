name: Resolve Stream On-Demand

'on':
  workflow_dispatch:
    inputs:
      target:
        description: 'Target type (futbol/cine/series)'
        required: true
        type: choice
        options:
          - futbol
          - cine
          - series
      id:
        description: 'Content ID (e.g., fc-espn, cu-resident-evil)'
        required: true
        type: string
      url:
        description: 'Embed URL to resolve'
        required: true
        type: string
      dry_run:
        description: 'Dry run (no KV write)'
        required: false
        type: boolean
        default: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
      options: --user root
    defaults:
      run:
        working-directory: /__w/futbol-cuevana-addon/futbol-cuevana-addon
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            chromium \
            chromium-driver \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            curl \
            && rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r extractors/requirements.txt

      - name: Install Playwright browsers
        run: python3 -m playwright install chromium

      - name: Resolve stream
        run: python3 -m extractors.main --type "${{ github.event.inputs.target }}" --id "${{ github.event.inputs.id }}" --url "${{ github.event.inputs.url }}" --output /tmp/result.json
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write stream to Cloudflare KV
        if: github.event.inputs.dry_run != 'true'
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
        run: |
          # Map target to Stremio content type
          if [ "${{ github.event.inputs.target }}" = "futbol" ]; then
            STREAM_TYPE="tv"
          elif [ "${{ github.event.inputs.target }}" = "cine" ]; then
            STREAM_TYPE="movie"
          elif [ "${{ github.event.inputs.target }}" = "series" ]; then
            STREAM_TYPE="series"
          else
            STREAM_TYPE="${{ github.event.inputs.target }}"
          fi
          curl -X PUT "https://api.cloudflare.com/client/v4/accounts/${CF_ACCOUNT_ID}/storage/kv/namespaces/${CF_KV_NAMESPACE_ID}/values/stream:${STREAM_TYPE}:${{ github.event.inputs.id }}" \
            -H "Authorization: Bearer ${CF_API_TOKEN}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/result.json
