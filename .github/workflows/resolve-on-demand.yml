name: Resolve Stream On-Demand

'on':
  workflow_dispatch:
    inputs:
      target:
        description: 'Target type (futbol/cine/series)'
        required: true
        type: choice
        options:
          - futbol
          - cine
          - series
      dry_run:
        description: 'Dry run (no KV write)'
        required: false
        type: boolean
        default: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
      options: --user root
    defaults:
      run:
        working-directory: /__w/futbol-cuevana-addon/futbol-cuevana-addon
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            chromium \
            chromium-driver \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            curl \
            && rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r extractors/requirements.txt

      - name: Install Playwright browsers
        run: python3 -m playwright install chromium

      - name: Resolve stream
        run: python3 -m extractors.main --target "${{ github.event.inputs.target }}" ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
