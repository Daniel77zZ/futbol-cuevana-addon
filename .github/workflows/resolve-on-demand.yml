name: Resolve Stream On-Demand

'on':
  workflow_dispatch:
    inputs:
      target:
        description: 'Target type (futbol/cine/series)'
        required: true
        type: choice
        options:
          - futbol
          - cine
          - series
      dry_run:
        description: 'Dry run (no KV write)'
        required: false
        type: boolean
        default: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.44.0-jammy
      options: --user root
    defaults:
      run:
        working-directory: extractors
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pip
        run: python3 -m ensurepip --upgrade

      - name: Install dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Resolve stream
        run: python3 -m extractors.main --target "${{ github.event.inputs.target }}" ${{ github.event.inputs.dry_run == 'true' && '--dry-run' || '' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
