name: Daily Catalog Update

'on':
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  update-catalog:
    runs-on: ubuntu-latest
    container:
      image: python:3.11-slim
      options: --user root
    defaults:
      run:
        working-directory: extractors
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          apt-get update && apt-get install -y --no-install-recommends \
            chromium \
            chromium-driver \
            libnss3 \
            libnspr4 \
            libatk1.0-0 \
            libatk-bridge2.0-0 \
            libcups2 \
            libdrm2 \
            libxkbcommon0 \
            libxcomposite1 \
            libxdamage1 \
            libxfixes3 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            && rm -rf /var/lib/apt/lists/*

      - name: Install Python dependencies
        run: |
          python3 -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright browsers
        run: python3 -m playwright install chromium

      - name: Run catalog update
        run: |
          python3 scrape_futbol_catalog.py --output /tmp/futbol-catalog.json
          python3 scrape_cuevana_catalog.py --type movie --url "https://cuevana3k.pro/peliculas" --output /tmp/cuevana-movies.json
          python3 scrape_cuevana_catalog.py --type series --url "https://cuevana3k.pro/series" --output /tmp/cuevana-series.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Write futbol catalog to Cloudflare KV
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: |
            kv key put --namespace-id=${{ secrets.CF_KV_NAMESPACE_ID }} \
              "catalog:tv:futbol" \
              --path=/tmp/futbol-catalog.json

      - name: Write movies catalog to Cloudflare KV
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: |
            kv key put --namespace-id=${{ secrets.CF_KV_NAMESPACE_ID }} \
              "catalog:movie:cine" \
              --path=/tmp/cuevana-movies.json

      - name: Write series catalog to Cloudflare KV
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          command: |
            kv key put --namespace-id=${{ secrets.CF_KV_NAMESPACE_ID }} \
              "catalog:series:series" \
              --path=/tmp/cuevana-series.json
